{% extends 'base.html' %}
{% block content %}
    <div class="container">
        <div class="contact-card">
            <h2>Contact Me</h2>
            <p class="lead">Have a question, booking request, or comment? Send a message and I'll get back to you soon.</p>
            <form method="post" action="" class="contact-form">
                {% csrf_token %}
                {{ form.non_field_errors }}
                {{ form.as_p }}
                <div class="form-actions">
                    <button type="submit" class="btn btn-contact">Send Message</button>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
